# Prueba cada cambio y, al etiquetar una versión vX.Y.Z, publica la imagen
# en GitHub Container Registry.
name: Imagen

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: node --test script/menu.test.mjs

      # El plugin solo se prueba de verdad dentro de Traefik, que lo ejecuta
      # con un intérprete: entorno local completo y prueba de humo.
      - run: docker compose -f dev/compose.yml up -d --build
      - run: dev/comprobar.sh
      - if: failure()
        run: docker compose -f dev/compose.yml logs
      - run: docker compose -f dev/compose.yml down -v

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
